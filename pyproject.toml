[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain_tumor"
version = "0.1.0"
description = "Brain tumor MRI classification (scratch CNN vs EfficientNet-B0) with Grad-CAM"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
