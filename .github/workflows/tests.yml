name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # CPU only: the suite uses synthetic images, so it needs no dataset, GPU,
    # checkpoints or Kaggle credentials. The one test that loads the trained
    # checkpoints skips itself when they are absent.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest -ra
